name: HCI artifacts
on:
  push:
    paths: ['diagrams/**', 'design/**', 'scripts/**', 'package*.json', '.github/workflows/hci-artifacts.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install fonts
        run: sudo apt-get install -y fonts-dejavu-core
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci
          python -m pip install -r scripts/requirements.txt
      - name: Validate and export diagrams
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run check
      - name: Export static design evidence
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run design:export
      - name: Check generated artifacts
        run: npm run artifacts:check
      - uses: actions/upload-artifact@v4
        with:
          name: hci-diagrams-and-static-design
          path: |
            diagrams/exports/
            design/exports/
            design/preview.html
            docs/validation.json
